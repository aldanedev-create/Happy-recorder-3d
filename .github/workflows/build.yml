name: Build Happy Recorder 3D for Windows

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  APP_PROJECT: windows/HappyRecorder3D.sln

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Jest
        run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # React Native Windows autolinking
      # ------------------------------------------------------------

      - name: Apply React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      - name: Verify React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --check `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # ------------------------------------------------------------
      # Restore NuGet packages
      # ------------------------------------------------------------

      - name: Configure NuGet
        shell: pwsh
        run: |
          Write-Host "NuGet sources:"
          nuget sources List

      - name: Restore React Native Windows NuGet packages
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          if (Test-Path $packagesDirectory) {
            Remove-Item `
              $packagesDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packagesDirectory | Out-Null

          Write-Host ""
          Write-Host "Searching for packages.config files..."
          Write-Host ""

          $packageConfigs = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -Filter "packages.config" `
            -File `
            -ErrorAction SilentlyContinue

          if (!$packageConfigs) {
            Write-Error "No packages.config files were found."
            exit 1
          }

          Write-Host "Found packages.config files:"
          Write-Host "============================"

          foreach ($config in $packageConfigs) {
            Write-Host $config.FullName
          }

          foreach ($config in $packageConfigs) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "Restoring:"
            Write-Host $config.FullName
            Write-Host "=========================================="

            nuget restore "$($config.FullName)" `
              -PackagesDirectory "$packagesDirectory" `
              -Source "https://api.nuget.org/v3/index.json" `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              Write-Error "NuGet restore failed for $($config.FullName)."
              exit $LASTEXITCODE
            }
          }

          Write-Host ""
          Write-Host "NuGet restore completed successfully."

      # ------------------------------------------------------------
      # Verify the exact CppWinRT version required by the
      # React Native Windows native modules.
      # ------------------------------------------------------------

      - name: Verify CppWinRT 2.0.200316.3
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $cppWinRT = Join-Path `
            $packagesDirectory `
            "Microsoft.Windows.CppWinRT.2.0.200316.3"

          $cppWinRTProps = Join-Path `
            $cppWinRT `
            "build\native\Microsoft.Windows.CppWinRT.props"

          Write-Host ""
          Write-Host "Checking CppWinRT:"
          Write-Host $cppWinRTProps
          Write-Host ""

          if (!(Test-Path $cppWinRTProps)) {
            Write-Error `
              "Microsoft.Windows.CppWinRT 2.0.200316.3 was not restored."

            Write-Host ""
            Write-Host "Available CppWinRT packages:"
            Write-Host "============================"

            Get-ChildItem `
              $packagesDirectory `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -like "Microsoft.Windows.CppWinRT*"
              } |
              Select-Object -ExpandProperty FullName

            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $cppWinRTProps

      # ------------------------------------------------------------
      # Verify the React Native Windows project.
      # ------------------------------------------------------------

      - name: Verify Microsoft.ReactNative reference
        shell: pwsh
        run: |
          $project = `
            "$env:GITHUB_WORKSPACE\windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

          if (!(Test-Path $project)) {
            Write-Error "HappyRecorder3D.vcxproj was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Checking:"
          Write-Host $project
          Write-Host ""

          $matches = Select-String `
            -Path $project `
            -Pattern "Microsoft.ReactNative" `
            -SimpleMatch `
            -ErrorAction SilentlyContinue

          if ($matches) {
            Write-Host "Microsoft.ReactNative references found:"
            Write-Host ""

            $matches | ForEach-Object {
              Write-Host "$($_.LineNumber): $($_.Line)"
            }
          }
          else {
            Write-Host "No direct Microsoft.ReactNative reference found."
            Write-Host "Continuing because RNW can import it indirectly."
          }

      # ------------------------------------------------------------
      # Show restored packages
      # ------------------------------------------------------------

      - name: Show restored NuGet packages
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Restored NuGet packages"
          Write-Host "=========================================="

          if (Test-Path $packagesDirectory) {
            Get-ChildItem `
              $packagesDirectory `
              -Directory `
              -ErrorAction SilentlyContinue |
              Sort-Object Name |
              Select-Object -ExpandProperty Name
          }
          else {
            Write-Host "windows\packages does not exist."
          }

      # ------------------------------------------------------------
      # Windows SDK
      # ------------------------------------------------------------

      - name: Show Windows SDKs
        shell: pwsh
        run: |
          Write-Host "Installed Windows SDKs:"
          Write-Host ""

          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Include" `
            -Directory |
            Select-Object -ExpandProperty Name

      # ------------------------------------------------------------
      # Visual Studio / MSBuild
      # ------------------------------------------------------------

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version

      # ------------------------------------------------------------
      # React Native versions
      # ------------------------------------------------------------

      - name: Verify React Native versions
        shell: pwsh
        run: |
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "React Native packages:"
          npm list react-native react-native-windows

      - name: Verify Babel resolution
        run: npm ls @babel/core

      # ------------------------------------------------------------
      # React Native Windows bundle
      # ------------------------------------------------------------

      - name: Create bundle output directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "ci-bundle-test"

      - name: Pre-bundle check
        shell: pwsh
        run: |
          npx react-native bundle `
            --platform windows `
            --dev false `
            --entry-file index.js `
            --bundle-output "ci-bundle-test\index.windows.bundle" `
            --assets-dest "ci-bundle-test" `
            --verbose

      # ------------------------------------------------------------
      # Build Windows MSIX
      # ------------------------------------------------------------

      - name: Build Windows MSIX
        shell: pwsh
        run: |
          $artifactsDirectory = `
            "$env:GITHUB_WORKSPACE\artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactsDirectory | Out-Null

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Building Happy Recorder 3D"
          Write-Host "=========================================="
          Write-Host ""

          msbuild "$env:APP_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.19041.0 `
            /p:TargetPlatformMinVersion=10.0.17763.0 `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$artifactsDirectory\" `
            "-flp:logfile=$env:GITHUB_WORKSPACE\msbuild.log;verbosity=diagnostic"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows MSIX build failed."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Windows MSIX build completed successfully."

      # ------------------------------------------------------------
      # Upload logs
      # ------------------------------------------------------------

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-logs
          path: |
            msbuild.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Upload Windows package
      # ------------------------------------------------------------

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  # --------------------------------------------------------------
  # GitHub Release
  # --------------------------------------------------------------

  release:
    name: Publish GitHub release
    needs: package

    if: >
      needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release == true

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**