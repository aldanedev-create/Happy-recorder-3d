name: Build Happy Recorder 3D for Windows

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  APP_PROJECT: windows/HappyRecorder3D.sln
  WINDOWS_SDK_VERSION: "10.0.19041.0"
  WINDOWS_MIN_VERSION: "10.0.17763.0"

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Jest
        run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # NODE
      # ------------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # ------------------------------------------------------------
      # MSBUILD
      # ------------------------------------------------------------

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------
      # NUGET
      # ------------------------------------------------------------

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure NuGet
        shell: pwsh
        run: |
          Write-Host "Configuring NuGet..."

          nuget sources Remove `
            -Name nuget.org `
            -NonInteractive `
            -Force `
            -ErrorAction SilentlyContinue

          nuget sources Add `
            -Name nuget.org `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive `
            -Force

          Write-Host ""
          Write-Host "NuGet sources:"
          nuget sources List

      # ------------------------------------------------------------
      # REACT NATIVE WINDOWS AUTOLINKING
      # ------------------------------------------------------------

      - name: Apply React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      - name: Verify React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --check `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # ------------------------------------------------------------
      # DISPLAY ENVIRONMENT
      # ------------------------------------------------------------

      - name: Show build environment
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Build Environment"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "NPM:"
          npm --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild -version

          Write-Host ""
          Write-Host "React Native versions:"
          npm list react-native react-native-windows

          Write-Host ""
          Write-Host "Windows SDKs:"
          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Include" `
            -Directory |
            Select-Object -ExpandProperty Name

      # ------------------------------------------------------------
      # CLEAR OLD NUGET CACHE
      # ------------------------------------------------------------

      - name: Clear NuGet HTTP cache
        shell: pwsh
        run: |
          nuget locals http-cache -clear

      # ------------------------------------------------------------
      # MSBUILD PACKAGE RESTORE
      #
      # IMPORTANT:
      # RNW 0.72 uses PackageReference for packages such as:
      #
      # boost 1.76.0.0
      # Microsoft.ReactNative
      # Microsoft.Windows.CppWinRT
      #
      # Therefore MSBuild restore is required.
      # ------------------------------------------------------------

      - name: Restore MSBuild NuGet packages
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Restoring MSBuild NuGet packages"
          Write-Host "=========================================="

          msbuild "$env:APP_PROJECT" `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestorePackagesConfig=true `
            /p:RestoreIgnoreFailedSources=false `
            /p:WindowsTargetPlatformVersion="${{ env.WINDOWS_SDK_VERSION }}" `
            /p:TargetPlatformMinVersion="${{ env.WINDOWS_MIN_VERSION }}" `
            /p:WindowsTargetPlatformMinVersion="${{ env.WINDOWS_MIN_VERSION }}" `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild NuGet restore failed."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # RESTORE LEGACY packages.config FILES
      #
      # Some RN Windows native modules still contain packages.config.
      # Restore those separately.
      # ------------------------------------------------------------

      - name: Restore packages.config dependencies
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packagesDirectory | Out-Null

          Write-Host "Looking for packages.config files..."

          $packageConfigs = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -Filter "packages.config" `
            -File `
            -ErrorAction SilentlyContinue

          if ($packageConfigs) {
            Write-Host ""
            Write-Host "Found packages.config files:"

            foreach ($config in $packageConfigs) {
              Write-Host "  $($config.FullName)"
            }

            foreach ($config in $packageConfigs) {
              Write-Host ""
              Write-Host "Restoring:"
              Write-Host "$($config.FullName)"

              nuget restore "$($config.FullName)" `
                -PackagesDirectory "$packagesDirectory" `
                -Source "https://api.nuget.org/v3/index.json" `
                -NonInteractive `
                -Verbosity detailed

              if ($LASTEXITCODE -ne 0) {
                Write-Error "NuGet restore failed for $($config.FullName)."
                exit $LASTEXITCODE
              }
            }
          }
          else {
            Write-Host "No packages.config files found."
          }

      # ------------------------------------------------------------
      # VERIFY BOOST
      # ------------------------------------------------------------

      - name: Verify Boost 1.76.0
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Searching for Boost 1.76.0"
          Write-Host "=========================================="

          $possibleBoostPaths = @(
            "$env:GITHUB_WORKSPACE\windows\packages\boost.1.76.0.0",
            "$env:USERPROFILE\.nuget\packages\boost\1.76.0",
            "$env:USERPROFILE\.nuget\packages\boost\1.76.0.0"
          )

          $boostFound = $false

          foreach ($path in $possibleBoostPaths) {
            if (Test-Path $path) {
              Write-Host ""
              Write-Host "FOUND BOOST:"
              Write-Host $path

              $header = Get-ChildItem `
                -Path $path `
                -Recurse `
                -Filter "expr_iif.hpp" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($header) {
                Write-Host ""
                Write-Host "FOUND REQUIRED BOOST HEADER:"
                Write-Host $header.FullName
                $boostFound = $true
              }
            }
          }

          if (!$boostFound) {
            Write-Host ""
            Write-Host "Boost was not found in the expected locations."

            Write-Host ""
            Write-Host "Searching NuGet global package cache..."

            Get-ChildItem `
              "$env:USERPROFILE\.nuget\packages" `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "boost" } |
              Select-Object -ExpandProperty FullName

            Write-Error `
              "Boost 1.76.0 was not restored correctly. Required header expr_iif.hpp is missing."

            exit 1
          }

      # ------------------------------------------------------------
      # VERIFY MICROSOFT.REACTNATIVE
      # ------------------------------------------------------------

      - name: Verify Microsoft.ReactNative
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Searching for Microsoft.ReactNative"
          Write-Host "=========================================="

          $paths = @(
            "$env:GITHUB_WORKSPACE\windows\packages\Microsoft.ReactNative.0.72.0",
            "$env:USERPROFILE\.nuget\packages\microsoft.reactnative\0.72.0"
          )

          $found = $false

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host ""
              Write-Host "FOUND:"
              Write-Host $path
              $found = $true
            }
          }

          if (!$found) {
            Write-Error "Microsoft.ReactNative 0.72.0 was not restored."
            exit 1
          }

      # ------------------------------------------------------------
      # VERIFY CPPWINRT
      # ------------------------------------------------------------

      - name: Verify CppWinRT
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Searching for Microsoft.Windows.CppWinRT"
          Write-Host "=========================================="

          $found = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\windows\packages" `
            -Recurse `
            -Filter "Microsoft.Windows.CppWinRT.props" `
            -File `
            -ErrorAction SilentlyContinue

          if ($found) {
            Write-Host ""
            Write-Host "FOUND CppWinRT:"
            $found | ForEach-Object {
              Write-Host $_.FullName
            }
          }
          else {
            Write-Host ""
            Write-Host "Searching global NuGet cache..."

            $foundGlobal = Get-ChildItem `
              "$env:USERPROFILE\.nuget\packages" `
              -Recurse `
              -Filter "Microsoft.Windows.CppWinRT.props" `
              -File `
              -ErrorAction SilentlyContinue

            if ($foundGlobal) {
              $foundGlobal | ForEach-Object {
                Write-Host $_.FullName
              }
            }
            else {
              Write-Error "Microsoft.Windows.CppWinRT.props was not restored."
              exit 1
            }
          }

      # ------------------------------------------------------------
      # SHOW NUGET PACKAGE DIRECTORIES
      # ------------------------------------------------------------

      - name: Show restored native packages
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Windows packages directory"
          Write-Host "=========================================="

          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          if (Test-Path $packagesDirectory) {
            Get-ChildItem `
              $packagesDirectory `
              -Directory |
              Sort-Object Name |
              Select-Object -ExpandProperty Name
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "NuGet global packages"
          Write-Host "=========================================="

          $globalPackages = "$env:USERPROFILE\.nuget\packages"

          if (Test-Path $globalPackages) {
            Get-ChildItem `
              $globalPackages `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "boost|microsoft.reactnative|cppwinrt"
              } |
              Select-Object -ExpandProperty FullName
          }

      # ------------------------------------------------------------
      # BABEL
      # ------------------------------------------------------------

      - name: Verify Babel resolution
        run: npm ls @babel/core

      # ------------------------------------------------------------
      # CREATE BUNDLE DIRECTORY
      # ------------------------------------------------------------

      - name: Create bundle output directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "ci-bundle-test" | Out-Null

      # ------------------------------------------------------------
      # PRE-BUNDLE
      # ------------------------------------------------------------

      - name: Pre-bundle check
        shell: pwsh
        run: |
          npx react-native bundle `
            --platform windows `
            --dev false `
            --entry-file index.js `
            --bundle-output "ci-bundle-test\index.windows.bundle" `
            --assets-dest "ci-bundle-test" `
            --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Error "React Native Windows bundle failed."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build Windows MSIX
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Building Happy Recorder 3D"
          Write-Host "=========================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null

          msbuild "$env:APP_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion="${{ env.WINDOWS_SDK_VERSION }}" `
            /p:TargetPlatformMinVersion="${{ env.WINDOWS_MIN_VERSION }}" `
            /p:WindowsTargetPlatformMinVersion="${{ env.WINDOWS_MIN_VERSION }}" `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\" `
            "-flp:logfile=$env:GITHUB_WORKSPACE\msbuild.log;verbosity=diagnostic"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows MSIX build failed."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # UPLOAD BUILD LOG
      # ------------------------------------------------------------

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # UPLOAD WINDOWS PACKAGE
      # ------------------------------------------------------------

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  # --------------------------------------------------------------
  # RELEASE
  # --------------------------------------------------------------

  release:
    name: Publish GitHub release
    needs: package
    if: >
      needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release == true

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**