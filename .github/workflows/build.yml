name: Build Happy Recorder 3D for Windows

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  APP_PROJECT: windows/HappyRecorder3D.sln

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Jest
        run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      # Apply Windows native-module autolinking before MSBuild.
      - name: Apply React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # Make sure autolinking is now clean.
      - name: Verify React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --check `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # Restore every NuGet packages.config in the project,
      # including packages belonging to native React Native modules.
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          New-Item -ItemType Directory -Force -Path $packagesDirectory | Out-Null

          $packageConfigs = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -Filter "packages.config" `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "NuGet package configuration files found:"
          $packageConfigs | ForEach-Object {
            Write-Host $_.FullName
          }

          foreach ($config in $packageConfigs) {
            Write-Host ""
            Write-Host "Restoring packages from:"
            Write-Host $config.FullName

            nuget restore $config.FullName `
              -PackagesDirectory $packagesDirectory `
              -NonInteractive
          }

      # Verify the CppWinRT package actually used by HappyRecorderNative.
      - name: Verify CppWinRT package
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $cppWinRT = Join-Path `
            $packagesDirectory `
            "Microsoft.Windows.CppWinRT.2.0.240405.15\build\native\Microsoft.Windows.CppWinRT.props"

          if (!(Test-Path $cppWinRT)) {
            Write-Error "Microsoft.Windows.CppWinRT 2.0.240405.15 was not restored."
            exit 1
          }

          Write-Host "FOUND: $cppWinRT"

      # Verify the React Native Windows NuGet package version.
      - name: Verify Microsoft.ReactNative package
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $reactNative = Join-Path `
            $packagesDirectory `
            "Microsoft.ReactNative.0.72.0"

          if (!(Test-Path $reactNative)) {
            Write-Error "Microsoft.ReactNative 0.72.0 was not restored."
            exit 1
          }

          Write-Host "FOUND: $reactNative"

      # Show all Windows SDKs available on the runner.
      - name: Show Windows SDKs
        shell: pwsh
        run: |
          Write-Host "Installed Windows SDKs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
            Select-Object -ExpandProperty Name

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version

      - name: Verify React Native versions
        run: |
          node --version
          npm --version
          npm list react-native react-native-windows

      - name: Verify Babel resolution
        run: npm ls @babel/core

      - name: Create bundle output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-bundle-test

      - name: Pre-bundle check
        run: >
          npx react-native bundle
          --platform windows
          --dev false
          --entry-file index.js
          --bundle-output ci-bundle-test/index.windows.bundle
          --assets-dest ci-bundle-test
          --verbose

      - name: Build Windows MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts"

          msbuild "$env:APP_PROJECT" `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.19041.0 `
            /p:TargetPlatformMinVersion=10.0.17763.0 `
            /p:WindowsTargetPlatformMinVersion=10.0.17763.0 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\" `
            "-flp:logfile=$env:GITHUB_WORKSPACE\msbuild.log;verbosity=diagnostic"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    if: needs.package.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**