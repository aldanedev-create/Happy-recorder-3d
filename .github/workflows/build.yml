name: Build Happy Recorder 3D for Windows

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  APP_PROJECT: windows/HappyRecorder3D.sln

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Jest
        run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      # Apply Windows native-module autolinking before MSBuild.
      - name: Apply React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # Make sure autolinking is now clean.
      - name: Verify React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --check `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # Restore the NuGet packages expected by the RN Windows modules.
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "windows\HappyRecorder3D.sln" `
            -PackagesDirectory "$env:GITHUB_WORKSPACE\windows\packages"

      # Verify the package that previously caused the build to fail.
      - name: Verify CppWinRT package
        shell: pwsh
        run: |
          $cppWinRT = "$env:GITHUB_WORKSPACE\windows\packages\Microsoft.Windows.CppWinRT.2.0.200316.3\build\native\Microsoft.Windows.CppWinRT.props"

          if (!(Test-Path $cppWinRT)) {
            Write-Error "Microsoft.Windows.CppWinRT.props was not restored."
            exit 1
          }

          Write-Host "Microsoft.Windows.CppWinRT restored successfully."

      - name: Show Windows SDKs
        shell: pwsh
        run: |
          Write-Host "Installed Windows SDKs:"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
            Select-Object -ExpandProperty Name

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version

      - name: Verify React Native versions
        run: |
          node --version
          npm --version
          npm list react-native react-native-windows

      - name: Verify Babel resolution
        run: npm ls @babel/core

      - name: Create bundle output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-bundle-test

      - name: Pre-bundle check
        run: >
          npx react-native bundle
          --platform windows
          --dev false
          --entry-file index.js
          --bundle-output ci-bundle-test/index.windows.bundle
          --assets-dest ci-bundle-test
          --verbose

      - name: Build Windows MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts"

          msbuild "$env:APP_PROJECT" `
            /restore `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.19041.0 `
            /p:TargetPlatformMinVersion=10.0.17763.0 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\" `
            "-flp:logfile=$env:GITHUB_WORKSPACE\msbuild.log;verbosity=diagnostic"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.create_release

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**