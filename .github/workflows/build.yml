name: Build Happy Recorder 3D for Windows

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: '18'
  APP_PROJECT: windows/HappyRecorder3D/HappyRecorder3D.vcxproj

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - name: Create release bundle
        shell: pwsh
        run: |
          msbuild $env:APP_PROJECT /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:AppxBundlePlatforms="x64" /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**
