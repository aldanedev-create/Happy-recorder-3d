name: Build Happy Recorder 3D for Windows

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with the Windows package
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "18"
  RN_VERSION: "0.72.0"
  RNW_VERSION: "0.72.0"
  BOOST_VERSION: "1.76.0.0"
  CPPWINRT_VERSION: "2.0.200316.3"
  APP_PROJECT: windows/HappyRecorder3D.sln
  WINDOWS_SDK_VERSION: "10.0.19041.0"
  WINDOWS_MIN_VERSION: "10.0.17763.0"

jobs:
  test:
    name: Test JavaScript app
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint -- --quiet

      - name: Jest
        run: npm test -- --runInBand --silent

  package:
    name: Build Windows MSIX
    needs: test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # VERIFY VERSIONS
      # ------------------------------------------------------------

      - name: Verify React Native versions
        shell: pwsh
        run: |
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "NPM:"
          npm --version

          Write-Host ""
          Write-Host "React Native packages:"
          npm list react-native react-native-windows --depth=0

      # ------------------------------------------------------------
      # NUGET CONFIGURATION
      # ------------------------------------------------------------

      - name: Configure NuGet
        shell: pwsh
        run: |
          Write-Host "Configuring NuGet..."

          nuget sources Remove `
            -Name nuget.org `
            -NonInteractive `
            -Force `
            -ErrorAction SilentlyContinue

          nuget sources Add `
            -Name nuget.org `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive `
            -Force

          Write-Host ""
          Write-Host "NuGet sources:"
          nuget sources List

      # ------------------------------------------------------------
      # AUTOLINK WINDOWS MODULES
      # ------------------------------------------------------------

      - name: Apply React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      - name: Verify React Native Windows autolinking
        shell: pwsh
        run: |
          npx react-native autolink-windows `
            --check `
            --sln "windows\HappyRecorder3D.sln" `
            --proj "windows\HappyRecorder3D\HappyRecorder3D.vcxproj"

      # ------------------------------------------------------------
      # PREPARE WINDOWS PACKAGES DIRECTORY
      # ------------------------------------------------------------

      - name: Prepare Windows packages directory
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          if (Test-Path $packagesDirectory) {
            Remove-Item `
              -Path $packagesDirectory `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packagesDirectory | Out-Null

          Write-Host "Packages directory:"
          Write-Host $packagesDirectory

      # ------------------------------------------------------------
      # FIND ALL PACKAGES.CONFIG FILES
      # ------------------------------------------------------------

      - name: Find NuGet package configurations
        shell: pwsh
        run: |
          $packageConfigs = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -Filter "packages.config" `
            -File `
            -ErrorAction SilentlyContinue

          if (!$packageConfigs) {
            Write-Host "No packages.config files found."
          }
          else {
            Write-Host ""
            Write-Host "packages.config files found:"
            Write-Host "============================"

            foreach ($config in $packageConfigs) {
              Write-Host $config.FullName
            }
          }

      # ------------------------------------------------------------
      # RESTORE PACKAGES.CONFIG
      # ------------------------------------------------------------

      - name: Restore packages.config files
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $packageConfigs = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE" `
            -Recurse `
            -Filter "packages.config" `
            -File `
            -ErrorAction SilentlyContinue

          foreach ($config in $packageConfigs) {
            Write-Host ""
            Write-Host "=============================================="
            Write-Host "Restoring:"
            Write-Host $config.FullName
            Write-Host "=============================================="

            nuget restore "$($config.FullName)" `
              -PackagesDirectory "$packagesDirectory" `
              -Source "https://api.nuget.org/v3/index.json" `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              Write-Error "NuGet restore failed for:"
              Write-Error $config.FullName
              exit $LASTEXITCODE
            }
          }

      # ------------------------------------------------------------
      # EXPLICITLY RESTORE BOOST 1.76.0
      # ------------------------------------------------------------

      - name: Restore Boost 1.76.0
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          Write-Host ""
          Write-Host "Restoring Boost 1.76.0.0..."
          Write-Host ""

          nuget install boost `
            -Version 1.76.0 `
            -OutputDirectory "$packagesDirectory" `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive `
            -DependencyVersion Highest `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to restore Boost 1.76.0."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # EXPLICITLY RESTORE CPPWINRT
      # ------------------------------------------------------------

      - name: Restore CppWinRT
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          Write-Host ""
          Write-Host "Restoring Microsoft.Windows.CppWinRT..."
          Write-Host ""

          nuget install Microsoft.Windows.CppWinRT `
            -Version "$env:CPPWINRT_VERSION" `
            -OutputDirectory "$packagesDirectory" `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive `
            -DependencyVersion Highest `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to restore Microsoft.Windows.CppWinRT."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # EXPLICITLY RESTORE MICROSOFT.REACTNATIVE
      # ------------------------------------------------------------

      - name: Restore Microsoft.ReactNative 0.72.0
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          Write-Host ""
          Write-Host "Restoring Microsoft.ReactNative 0.72.0..."
          Write-Host ""

          nuget install Microsoft.ReactNative `
            -Version "$env:RNW_VERSION" `
            -OutputDirectory "$packagesDirectory" `
            -Source "https://api.nuget.org/v3/index.json" `
            -NonInteractive `
            -DependencyVersion Highest `
            -Verbosity detailed

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to restore Microsoft.ReactNative 0.72.0."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # SHOW RESTORED PACKAGES
      # ------------------------------------------------------------

      - name: Show restored Windows packages
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          Write-Host ""
          Write-Host "Restored packages:"
          Write-Host "=================="

          Get-ChildItem `
            -Path $packagesDirectory `
            -Directory |
            Sort-Object Name |
            Select-Object -ExpandProperty Name

      # ------------------------------------------------------------
      # VERIFY BOOST
      # ------------------------------------------------------------

      - name: Verify Boost
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $boostDirectory = Join-Path `
            $packagesDirectory `
            "boost.1.76.0"

          if (!(Test-Path $boostDirectory)) {
            $boostDirectory = Join-Path `
              $packagesDirectory `
              "boost.1.76.0.0"
          }

          if (!(Test-Path $boostDirectory)) {
            Write-Error "Boost 1.76.0 was not restored."
            Write-Host "Available packages:"

            Get-ChildItem `
              -Path $packagesDirectory `
              -Directory |
              Select-Object -ExpandProperty Name

            exit 1
          }

          Write-Host "FOUND Boost:"
          Write-Host $boostDirectory

          $boostHeader = Get-ChildItem `
            -Path $boostDirectory `
            -Recurse `
            -Filter "expr_iif.hpp" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$boostHeader) {
            Write-Error "Boost was restored but expr_iif.hpp was not found."
            exit 1
          }

          Write-Host "FOUND Boost header:"
          Write-Host $boostHeader.FullName

      # ------------------------------------------------------------
      # VERIFY CPPWINRT
      # ------------------------------------------------------------

      - name: Verify CppWinRT
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $cppWinRT = Join-Path `
            $packagesDirectory `
            "Microsoft.Windows.CppWinRT.$env:CPPWINRT_VERSION"

          if (!(Test-Path $cppWinRT)) {
            Write-Error "Microsoft.Windows.CppWinRT $env:CPPWINRT_VERSION was not restored."

            Write-Host ""
            Write-Host "Available CppWinRT packages:"

            Get-ChildItem `
              -Path $packagesDirectory `
              -Directory |
              Where-Object {
                $_.Name -like "Microsoft.Windows.CppWinRT*"
              } |
              Select-Object -ExpandProperty Name

            exit 1
          }

          $cppWinRTProps = Join-Path `
            $cppWinRT `
            "build\native\Microsoft.Windows.CppWinRT.props"

          if (!(Test-Path $cppWinRTProps)) {
            Write-Error "CppWinRT props file is missing:"
            Write-Error $cppWinRTProps
            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $cppWinRTProps

      # ------------------------------------------------------------
      # VERIFY MICROSOFT.REACTNATIVE
      # ------------------------------------------------------------

      - name: Verify Microsoft.ReactNative
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $reactNative = Join-Path `
            $packagesDirectory `
            "Microsoft.ReactNative.$env:RNW_VERSION"

          if (!(Test-Path $reactNative)) {
            Write-Error "Microsoft.ReactNative $env:RNW_VERSION was not restored."

            Write-Host ""
            Write-Host "Available Microsoft.ReactNative packages:"

            Get-ChildItem `
              -Path $packagesDirectory `
              -Directory |
              Where-Object {
                $_.Name -like "Microsoft.ReactNative*"
              } |
              Select-Object -ExpandProperty Name

            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $reactNative

      # ------------------------------------------------------------
      # VERIFY REQUIRED BOOST HEADER DIRECTLY
      # ------------------------------------------------------------

      - name: Verify Boost include path
        shell: pwsh
        run: |
          $packagesDirectory = "$env:GITHUB_WORKSPACE\windows\packages"

          $boostInclude = Get-ChildItem `
            -Path $packagesDirectory `
            -Recurse `
            -Filter "expr_iif.hpp" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$boostInclude) {
            Write-Error "Cannot find boost/preprocessor/control/expr_iif.hpp."
            exit 1
          }

          Write-Host "Boost include directory:"
          Write-Host $boostInclude.Directory.Parent.Parent.FullName

      # ------------------------------------------------------------
      # WINDOWS SDK
      # ------------------------------------------------------------

      - name: Show Windows SDKs
        shell: pwsh
        run: |
          Write-Host "Installed Windows SDKs:"
          Write-Host "======================"

          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Include" `
            -Directory |
            Select-Object -ExpandProperty Name

      # ------------------------------------------------------------
      # VISUAL STUDIO
      # ------------------------------------------------------------

      - name: Verify Visual Studio and MSBuild
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version

          Write-Host ""
          Write-Host "Visual Studio installation:"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

      # ------------------------------------------------------------
      # BABEL
      # ------------------------------------------------------------

      - name: Verify Babel resolution
        run: npm ls @babel/core

      # ------------------------------------------------------------
      # PRE-BUNDLE
      # ------------------------------------------------------------

      - name: Create bundle output directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "ci-bundle-test" | Out-Null

      - name: Pre-bundle check
        run: >
          npx react-native bundle
          --platform windows
          --dev false
          --entry-file index.js
          --bundle-output ci-bundle-test/index.windows.bundle
          --assets-dest ci-bundle-test
          --verbose

      # ------------------------------------------------------------
      # BUILD MSIX
      # ------------------------------------------------------------

      - name: Build Windows MSIX
        shell: pwsh
        run: |
          $artifactsDirectory = "$env:GITHUB_WORKSPACE\artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactsDirectory | Out-Null

          Write-Host ""
          Write-Host "Starting Windows MSIX build..."
          Write-Host ""

          msbuild "$env:APP_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion="$env:WINDOWS_SDK_VERSION" `
            /p:TargetPlatformMinVersion="$env:WINDOWS_MIN_VERSION" `
            /p:WindowsTargetPlatformMinVersion="$env:WINDOWS_MIN_VERSION" `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$artifactsDirectory\" `
            "-flp:logfile=$env:GITHUB_WORKSPACE\msbuild.log;verbosity=diagnostic"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows MSIX build failed."
            exit $LASTEXITCODE
          }

      # ------------------------------------------------------------
      # UPLOAD LOG
      # ------------------------------------------------------------

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # UPLOAD WINDOWS PACKAGE
      # ------------------------------------------------------------

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: |
            artifacts/**/*.msix
            artifacts/**/*.msixbundle
            artifacts/**/*.msixupload
            artifacts/**/*.appx
            artifacts/**/*.appxbundle
          if-no-files-found: error

  # --------------------------------------------------------------
  # GITHUB RELEASE
  # --------------------------------------------------------------

  release:
    name: Publish GitHub release
    needs: package
    if: |
      needs.package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.create_release == true

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: HappyRecorder3D-Windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Happy Recorder 3D build ${{ github.run_number }}
          generate_release_notes: true
          files: release/**